[project]
name = "tiered-data-lakehouse-compaction"
version = "0.1.0"
description = "Delta Lake compaction engine for streaming lakehouse small-file remediation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: fast unit tests (no Docker, no Spark)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^src/compactor/delta_compactor\\.py$",
    "^src/streaming/spark_streaming_job\\.py$",
    "^src/producer/event_producer\\.py$",
    "^src/benchmark/benchmark_queries\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "src.compactor.file_scanner",
    "src.compactor.lock_manager",
]
disable_error_code = ["attr-defined"]
