services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: lakehouse-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-02T17-50-41Z
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/lakehouse;
      mc anonymous set download local/lakehouse;
      echo 'MinIO bucket lakehouse ready';
      "

  spark:
    image: bitnami/spark:3.5.1
    container_name: lakehouse-spark
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      MINIO_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-http://minio:9000}}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      DELTA_TABLE_PATH: ${RAW_TABLE_PATH:-${DELTA_TABLE_PATH:-s3a://lakehouse/raw/events}}
      DELTA_CHECKPOINT_PATH: ${CHECKPOINT_PATH:-${DELTA_CHECKPOINT_PATH:-s3a://lakehouse/checkpoints/raw_events}}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPARK_MASTER: spark://spark:7077
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./:/workspace
      - ./configs/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - spark_ivy:/opt/bitnami/spark/.ivy2
    depends_on:
      minio-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lakehouse-producer
    profiles: ["producer"]
    command: python -m src.producer.event_producer
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    volumes:
      - ./:/workspace
    working_dir: /workspace
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  streaming:
    image: bitnami/spark:3.5.1
    container_name: lakehouse-streaming
    profiles: ["streaming"]
    environment:
      SPARK_MODE: client
      SPARK_MASTER_URL: spark://spark:7077
      SPARK_MASTER: spark://spark:7077
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      S3_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-http://minio:9000}}
      MINIO_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-http://minio:9000}}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      RAW_TABLE_PATH: ${RAW_TABLE_PATH:-${DELTA_TABLE_PATH:-s3a://lakehouse/raw/events}}
      DELTA_TABLE_PATH: ${RAW_TABLE_PATH:-${DELTA_TABLE_PATH:-s3a://lakehouse/raw/events}}
      CHECKPOINT_PATH: ${CHECKPOINT_PATH:-${DELTA_CHECKPOINT_PATH:-s3a://lakehouse/checkpoints/raw_events}}
      DELTA_CHECKPOINT_PATH: ${CHECKPOINT_PATH:-${DELTA_CHECKPOINT_PATH:-s3a://lakehouse/checkpoints/raw_events}}
      QUARANTINE_TABLE_PATH: ${QUARANTINE_TABLE_PATH:-s3a://lakehouse/quarantine/events}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-raw_events}
    volumes:
      - ./:/workspace
      - ./logs:/workspace/logs
      - spark_ivy:/opt/bitnami/spark/.ivy2
    working_dir: /workspace
    command: ["/bin/bash", "/workspace/scripts/spark-streaming-submit.sh"]
    depends_on:
      spark:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  compactor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lakehouse-compactor
    command: python -m src.compactor.compaction_daemon --daemon
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      S3_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-http://minio:9000}}
      MINIO_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-http://minio:9000}}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      RAW_TABLE_PATH: ${RAW_TABLE_PATH:-${DELTA_TABLE_PATH:-s3a://lakehouse/raw/events}}
      DELTA_TABLE_PATH: ${RAW_TABLE_PATH:-${DELTA_TABLE_PATH:-s3a://lakehouse/raw/events}}
      SPARK_MASTER: spark://spark:7077
      COMPACTION_INTERVAL_SECONDS: ${COMPACTION_INTERVAL_SECONDS:-3600}
    volumes:
      - ./:/workspace
      - ./logs:/workspace/logs
      - ./locks:/workspace/locks
    working_dir: /workspace
    depends_on:
      spark:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from src.compactor.config import CompactionConfig; CompactionConfig()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  minio_data:
  spark_ivy:
